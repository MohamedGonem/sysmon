<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background Container -->
  <rect width="512" height="512" rx="128" fill="#0d1117" stroke="#30363d" stroke-width="8"/>
  
  <!-- Terminal Header Dots -->
  <circle cx="64" cy="56" r="12" fill="#ff5f56" />
  <circle cx="104" cy="56" r="12" fill="#ffbd2e" />
  <circle cx="144" cy="56" r="12" fill="#27c93f" />
  
  <!-- Grid Lines (Background Telemetry) -->
  <line x1="64" y1="130" x2="448" y2="130" stroke="#21262d" stroke-width="4" stroke-dasharray="8 8" />
  <line x1="64" y1="220" x2="448" y2="220" stroke="#21262d" stroke-width="4" stroke-dasharray="8 8" />
  <line x1="64" y1="310" x2="448" y2="310" stroke="#21262d" stroke-width="4" stroke-dasharray="8 8" />
  <line x1="160" y1="96" x2="160" y2="340" stroke="#21262d" stroke-width="4" stroke-dasharray="8 8" />
  <line x1="256" y1="96" x2="256" y2="340" stroke="#21262d" stroke-width="4" stroke-dasharray="8 8" />
  <line x1="352" y1="96" x2="352" y2="340" stroke="#21262d" stroke-width="4" stroke-dasharray="8 8" />

  <!-- The Sysmon Pulse Line (Glow Effect) -->
  <path d="M 64 220 L 160 220 L 200 104 L 256 336 L 312 144 L 352 220 L 448 220" 
        fill="none" 
        stroke="#58a6ff" 
        stroke-width="24" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        opacity="0.3" />

  <!-- The Sysmon Pulse Line (Core) -->
  <path d="M 64 220 L 160 220 L 200 104 L 256 336 L 312 144 L 352 220 L 448 220" 
        fill="none" 
        stroke="#58a6ff" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Corrected Active Telemetry Dot at the end of the line (448, 220) -->
  <circle cx="448" cy="220" r="10" fill="#58a6ff" />

  <!-- "sysmon" Red Text Label -->
  <text x="256" 
        y="435" 
        fill="#f43f5e" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="56" 
        font-weight="800" 
        letter-spacing="6" 
        text-anchor="middle">sysmon</text>
</svg>
