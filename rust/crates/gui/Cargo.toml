[package]
name = "rsysmon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A Linux system monitoring tool's GUI implementation"
repository = "https://github.com/MohamedGonem/sysmon"
readme = "README.md"

[[bin]]
name = "sysmon"
path = "src/main.rs"

[features]
default = ["sys","cpu", "mem", "bat", "tmux"]
sys = ["tmux"]
cpu = ["tmux"]
mem = ["tmux"]
bat = ["tmux"]
tmux = []
