[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.4"
license = "MIT"

[workspace.dependencies]
sysmon-core = { path = "crates/core" }

[profile.dev]
opt-level = 2
debug = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
