name: Release Dry Run

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  dry-run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build release binaries
        run: cargo build --release -p rsysmon-cli -p rsysmond -p rsysmon

      - name: Package workspace
        run: cargo package --workspace --no-verify

      # Verification compiles against the published core, which lags this workspace.
      # The build job already compiles every binary.
      - name: Publish dry run
        run: cargo publish --dry-run --workspace --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
